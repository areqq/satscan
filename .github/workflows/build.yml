name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Build (armhf without NEON + mipsel r1)
        run: |
          zig version
          zig build
          file zig-out/bin/satscan-armhf zig-out/bin/satscan-mipsel

      - name: Checksums
        working-directory: zig-out/bin
        run: sha256sum satscan-* | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: satscan-binaries
          path: |
            zig-out/bin/satscan-*
            zig-out/bin/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: satscan-binaries
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Release notes = the annotated tag message (the changelog is written
          # there at tag time), so every release describes what actually changed.
          # shallow checkout may lack the annotated tag object itself - fetch it
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          git tag -l --format='%(contents)' "$tag" > notes.md
          [ -s notes.md ] || echo "satscan $tag" > notes.md
          printf '\n---\n**satscan-armhf** — ARMv7 without NEON (any ARM Enigma2 box) · **satscan-mipsel** — MIPS32 r1 (older Broadcom boxes)\n' >> notes.md
          gh release create "$tag" dist/satscan-armhf dist/satscan-mipsel dist/SHA256SUMS \
            --title "satscan $tag" --notes-file notes.md
